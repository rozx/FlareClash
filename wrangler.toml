name = "flareclash"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# ── 管理页静态资产（/admin/*，不占 Workers 请求额度）──────────
# 部署时目录必须存在；public/admin/ 下的文件直接由 Cloudflare 边缘返回，
# 其余路径（/sub/*、/api/*）落入 Worker。
[assets]
directory = "./public"

# ── D1：元数据存储 ──────────────────────────────────────────────
# database_id 为占位符；部署前用 `wrangler d1 create flareclash`
# 的输出替换（本地开发与测试不使用该 id）。
[[d1_databases]]
binding = "DB"
database_name = "flareclash"
database_id = "a1b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6"
migrations_dir = "migrations"

# ── KV：上游订阅内容缓存（键 fc:src:<id>:data / :fetched）──────
# id 为占位符；部署前用 `wrangler kv namespace create CACHE` 输出替换。
[[kv_namespaces]]
binding = "KV"
id = "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"

# ── 可调参数（额度安全阀）───────────────────────────────────────
[vars]
# 默认缓存有效期（秒）= 30 分钟
CACHE_TTL_DEFAULT = "1800"
# 最短回源间隔（秒）= 15 分钟。
# KV 写上限 ≈ 源数 × 2 × 86400 / MIN_FETCH_INTERVAL，免费额度 1000 写/天。
MIN_FETCH_INTERVAL = "900"
# 回源请求超时（毫秒）
FETCH_TIMEOUT_MS = "10000"
# 回源使用的 User-Agent（部分机场校验 UA）
FETCH_USER_AGENT = "clash-verge/v1.7.7"

# secrets（wrangler secret put，本地开发写入 .dev.vars）：
#   ADMIN_PASSWORD  管理员登录密码
#   AUTH_SECRET     会话签名密钥（不设则由 ADMIN_PASSWORD 派生，不推荐）
